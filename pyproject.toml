[project]
name = "bazaar"
version = "0.1.0"
description = "Flexible Microservice marketplace"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "TemaDrakoshef", email = "artem125149@gmail.com" },
]
dependencies = []

[tool.uv.workspace]
members = [
    "services/*",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]


[tool.ruff]
target-version = "py312"

line-length = 88

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

ignore = [
    "B008", # FastAPI Depends()
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["libs", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
explicit_package_bases = true

plugins = [
    "pydantic.mypy"
]

exclude = [
    "frontend",
    "venv",
    ".venv"
]