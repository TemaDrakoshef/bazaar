[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts = -q
markers =
    unit: Fast unit tests with gRPC client mocks
    integration: Tests with a real auth_service and a test database (skipped without PostgreSQL)
    e2e: End‑to‑end scenarios via HTTP + real auth_service (skipped without PostgreSQL)

asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
env_files = .env.test
