[project]
name = "api-gateway"
version = "0.1.0"
description = "HTTP REST -> gRPC API Gateway"
requires-python = ">=3.12"
authors = [
    { name = "TemaDrakoshef", email = "artem125149@gmail.com" },
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "uvicorn>=0.51.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.1.3",
    "httpx2>=2.9.1",
]

