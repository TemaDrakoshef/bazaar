services:
  seller_db:
    image: postgres:16
    container_name: seller_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - seller_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  seller_migrations:
    build: .
    container_name: seller_migrations
    env_file: .env
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      seller_db:
        condition: service_healthy
    networks:
      - app-network

  seller_service:
    build: .
    container_name: seller_service
    env_file: .env
    restart: on-failure:5
    networks:
      - app-network
    depends_on:
      seller_db:
        condition: service_healthy
      seller_migrations:
        condition: service_completed_successfully

networks:
  app-network:
    driver: bridge

volumes:
  seller_postgres_data: