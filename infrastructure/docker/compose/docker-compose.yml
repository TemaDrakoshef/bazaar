networks:
  app-network:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
    #   tempo-data:
    #   alertmanager-data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: bazaar-otel-collector
    command: [ "--config=/etc/otelcol/config.yaml" ]
    environment:
      OTEL_DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
    volumes:
      - ../../observability/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_OTLP_GRPC_PORT:-4317}:4317" # OTLP/gRPC
      - "${OTEL_COLLECTOR_OTLP_HTTP_PORT:-4318}:4318" # OTLP/HTTP
      - "${OTEL_COLLECTOR_METRICS_PORT:-8889}:8889" # Prometheus scrape endpoint
      - "13133:13133" # healthz
    depends_on:
      loki:
        condition: service_started
      # tempo:
      #   condition: service_started
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: bazaar-prometheus
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      CLUSTER_NAME: ${CLUSTER_NAME:-bazaar-local}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # depends_on:
    #   alertmanager:
    #     condition: service_started
    networks:
      - app-network

  loki:
    image: grafana/loki:3.7.6
    container_name: bazaar-loki
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
      - "-config.expand-env=true"
    volumes:
      - ../../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:13.1.3
    container_name: bazaar-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bazaar-overview.json
    volumes:
      - grafana-data:/var/lib/grafana

      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/api/health | grep -q '\"database\": \"ok\"' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_started
      # tempo:
      #   condition: service_started
      loki:
        condition: service_started
    networks:
      - app-network
