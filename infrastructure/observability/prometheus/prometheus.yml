global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ${DEPLOYMENT_ENVIRONMENT}
    cluster: ${CLUSTER_NAME}

scrape_configs:
  - job_name: bazaar-microservices
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]