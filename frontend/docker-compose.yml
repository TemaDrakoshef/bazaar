x-api-url: &api-url ${FRONTEND_API_URL:-http://host.docker.internal:8000}

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: *api-url
    image: bazaar-frontend:latest
    container_name: bazaar_frontend
    init: true
    restart: unless-stopped
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: *api-url
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
