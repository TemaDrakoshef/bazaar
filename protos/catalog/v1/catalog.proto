syntax = "proto3";

package catalog.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";


service CatalogService {
  // Product CRUD
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc ReadProduct(ProductIdRequest) returns (Product);
  rpc ReadListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc DeleteProduct(DeleteProductRequest) returns (google.protobuf.Empty);

  // Product media
  rpc GetMediaUploadUrl(GetMediaUploadUrlRequest) returns (GetMediaUploadUrlResponse);
  rpc ConfirmMediaUpload(ConfirmMediaUploadRequest) returns (ProductMedia);
  rpc DeleteMedia(DeleteMediaRequest) returns (google.protobuf.Empty);
  rpc ReorderMedia(ReorderMediaRequest) returns (google.protobuf.Empty);

  // Category CRUD
  rpc CreateCategory(CreateCategoryRequest) returns (Category);
  rpc ReadCategory(CategoryIdRequest) returns (Category);
  rpc ReadListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (Category);
  rpc DeleteCategory(CategoryIdRequest) returns (google.protobuf.Empty);
  rpc MoveCategory(MoveCategoryRequest) returns (Category);
}


// common

message ProductIdRequest {
  int64 product_id = 1;
}

message CategoryIdRequest {
  int64 category_id = 1;
}

// product

message Product {
  int64 id = 1;
  int64 category_id = 2;
  string title = 3;
  optional string description = 4;
  int32 price = 5;
  int32 stock = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Owning merchant (seller). Cross-service reference, no FK.
  int64 merchant_id = 10;
  // Gallery media (images and the single video), ordered by position.
  repeated ProductMedia media = 11;
}

message CreateProductRequest {
  int64 category_id = 1;
  string title = 2;
  optional string description = 3;
  int32 price = 5;
  int32 stock = 6;
  // Merchant that will own the product.
  int64 merchant_id = 7;
}

message ListProductsRequest {
  int32 limit = 1;   // page size, >0
  int32 offset = 2;  // >=0
  // Optional filter: return only products owned by this merchant.
  optional int64 merchant_id = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  int64 count = 2;
}

message UpdateProductRequest {
  int64 product_id = 1;
  optional int64 category_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional int32 price = 5;
  optional int32 stock = 6;
  optional bool is_active = 7;
  // Merchant requesting the update; must own the product.
  int64 merchant_id = 8;
}

message DeleteProductRequest {
  int64 product_id = 1;
  // Merchant requesting the deletion; must own the product.
  int64 merchant_id = 2;
}

// category

message Category {
  int64 id = 1;
  string name = 2;
  string path = 3;
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  optional int64 parent_id = 7;
}

message CreateCategoryRequest {
  string name = 1;
  optional int64 parent_id = 2;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message UpdateCategoryRequest {
  int64 category_id = 1;
  optional string name = 2;
  optional bool is_active = 4;
}

message MoveCategoryRequest {
  int64 category_id = 1;
  optional int64 parent_id = 2;
}

// media

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
}

message ProductMedia {
  int64 id = 1;
  int64 product_id = 2;
  MediaType media_type = 3;
  string url = 4;
  int32 position = 5;
  optional int32 width = 6;
  optional int32 height = 7;
  optional int32 duration_seconds = 8;
  int64 file_size = 9;
}

message GetMediaUploadUrlRequest {
  int64 product_id = 1;
  int64 merchant_id = 2;
  MediaType media_type = 3;
  string content_type = 4;
  int64 file_size = 5;
}

message GetMediaUploadUrlResponse {
  string upload_url = 1;
  string storage_key = 2;
  string public_url = 3;
}

message ConfirmMediaUploadRequest {
  int64 product_id = 1;
  int64 merchant_id = 2;
  MediaType media_type = 3;
  string storage_key = 4;
  string public_url = 5;
  int64 file_size = 6;
  optional int32 width = 7;
  optional int32 height = 8;
  optional int32 duration_seconds = 9;
}

message DeleteMediaRequest {
  int64 product_id = 1;
  int64 merchant_id = 2;
  int64 media_id = 3;
}

message ReorderMediaItem {
  int64 media_id = 1;
  int32 position = 2;
}

message ReorderMediaRequest {
  int64 product_id = 1;
  int64 merchant_id = 2;
  repeated ReorderMediaItem items = 3;
}